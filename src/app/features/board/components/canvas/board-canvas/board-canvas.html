<!--
  BoardCanvas
  El contenedor externo maneja scroll y cursor. La surface interna es el sistema
  de coordenadas donde viven los objetos; por eso tiene #surface y position
  relative.
-->
<div
  class="board-canvas w-100 h-100"
  [style.cursor]="canvasCursor()"
  (mousedown)="onCanvasMouseDown($event)"
>
  <div class="board-canvas__surface" #surface>
    @for (obj of objects(); track obj.id) {
      <app-board-object
        [object]="obj"
        appDraggableObject
        [initialX]="obj.x"
        [initialY]="obj.y"
        (dragged)="onObjectDragged(obj.id, $event)"
        (mousedown)="onObjectMouseDown(obj.id, $event)"
      />
    }
  </div>
</div>
